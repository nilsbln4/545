[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk545"
version = "0.1.0"
description = "Python port of the FinTech 545 risk-management library, built against the class's functional tests."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.6",
    "pytest>=8.0",
    "jupyter",
    "ipykernel",
    "statsmodels>=0.14",  # used by Assignments/Assignment1
]

[tool.setuptools]
packages = ["risk545"]
