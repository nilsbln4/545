[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk545"
version = "0.1.0"
description = "Python port of the FinTech 545 risk-management library, built against the class's functional tests."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
]

[tool.setuptools]
packages = ["risk545"]
